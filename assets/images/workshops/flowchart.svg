<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Start/End oval -->
  <ellipse cx="64" cy="14" rx="22" ry="8" stroke="url(#g1)" stroke-width="3" fill="rgba(59,130,246,0.08)"/>
  <text x="64" y="17" text-anchor="middle" fill="url(#g1)" font-size="8" font-weight="bold" font-family="sans-serif">بداية</text>
  <!-- Arrow down -->
  <line x1="64" y1="22" x2="64" y2="34" stroke="url(#g1)" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Process rectangle -->
  <rect x="34" y="34" width="60" height="24" rx="4" stroke="url(#g1)" stroke-width="3" fill="rgba(139,92,246,0.08)"/>
  <line x1="44" y1="44" x2="62" y2="44" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="50" x2="56" y2="50" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow down -->
  <line x1="64" y1="58" x2="64" y2="70" stroke="url(#g1)" stroke-width="2.5"/>
  <!-- Decision diamond -->
  <polygon points="64,70 90,86 64,102 38,86" stroke="url(#g1)" stroke-width="3" fill="rgba(59,130,246,0.08)"/>
  <line x1="54" y1="83" x2="64" y2="90" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="90" x2="74" y2="83" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="86" r="2" fill="url(#g1)"/>
  <!-- Arrow right (yes) -->
  <line x1="90" y1="86" x2="108" y2="86" stroke="#22c55e" stroke-width="2.5"/>
  <text x="99" y="81" text-anchor="middle" fill="#22c55e" font-size="7" font-weight="bold" font-family="sans-serif">نعم</text>
  <!-- Arrow left (no) -->
  <line x1="38" y1="86" x2="18" y2="86" stroke="#ef4444" stroke-width="2.5"/>
  <text x="28" y="81" text-anchor="middle" fill="#ef4444" font-size="7" font-weight="bold" font-family="sans-serif">لا</text>
  <!-- Arrow down from diamond -->
  <line x1="64" y1="102" x2="64" y2="114" stroke="url(#g1)" stroke-width="2.5"/>
  <!-- End oval -->
  <ellipse cx="64" cy="120" rx="22" ry="8" stroke="url(#g1)" stroke-width="3" fill="rgba(59,130,246,0.08)"/>
  <text x="64" y="124" text-anchor="middle" fill="url(#g1)" font-size="8" font-weight="bold" font-family="sans-serif">نهاية</text>
</svg>