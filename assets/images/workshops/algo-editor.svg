<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Code editor frame -->
  <rect x="12" y="10" width="104" height="108" rx="10" stroke="url(#g1)" stroke-width="4" fill="rgba(59,130,246,0.06)"/>
  <!-- Title bar dots -->
  <circle cx="26" cy="24" r="3.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="24" r="3.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="54" cy="24" r="3.5" fill="#22c55e" opacity="0.8"/>
  <!-- Line numbers -->
  <text x="22" y="44" fill="var(--text-secondary, #94a3b8)" font-size="7" font-family="monospace" opacity="0.5">1</text>
  <text x="22" y="56" fill="var(--text-secondary, #94a3b8)" font-size="7" font-family="monospace" opacity="0.5">2</text>
  <text x="22" y="68" fill="var(--text-secondary, #94a3b8)" font-size="7" font-family="monospace" opacity="0.5">3</text>
  <text x="22" y="80" fill="var(--text-secondary, #94a3b8)" font-size="7" font-family="monospace" opacity="0.5">4</text>
  <text x="22" y="92" fill="var(--text-secondary, #94a3b8)" font-size="7" font-family="monospace" opacity="0.5">5</text>
  <!-- Code lines -->
  <rect x="34" y="38" width="14" height="4" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="52" y="38" width="40" height="4" rx="2" fill="#8b5cf6" opacity="0.5"/>
  <rect x="34" y="50" width="28" height="4" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="34" y="62" width="50" height="4" rx="2" fill="#8b5cf6" opacity="0.5"/>
  <rect x="34" y="74" width="36" height="4" rx="2" fill="#3b82f6" opacity="0.6"/>
  <rect x="34" y="86" width="18" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>
  <!-- Braces decoration -->
  <text x="95" y="68" fill="url(#g1)" font-size="24" font-weight="bold" font-family="monospace" opacity="0.25">{ }</text>
  <!-- Gear icon overlay -->
  <circle cx="98" cy="100" r="14" stroke="url(#g1)" stroke-width="2.5" fill="rgba(59,130,246,0.08)"/>
  <circle cx="98" cy="100" r="5" fill="url(#g1)"/>
</svg>