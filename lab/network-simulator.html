<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي الشبكات</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; height: 100vh; }

/* شريط الأدوات العلوي */
.toolbar {
  background: #16213e;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 2px solid #0f3460;
  user-select: none;
}
.toolbar .logo { font-size: 20px; font-weight: bold; color: #e94560; margin-left: 20px; }
.tool-btn {
  background: #0f3460;
  color: #eee;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: 0.2s;
}
.tool-btn:hover { background: #e94560; }
.tool-btn.active { background: #e94560; box-shadow: 0 0 10px #e9456080; }
.tool-btn .icon { font-size: 18px; }
.toolbar .separator { width: 1px; height: 30px; background: #0f3460; margin: 0 5px; }

/* منطقة السحب */
.canvas-area {
  position: relative;
  flex: 1;
  height: calc(100vh - 60px);
  overflow: hidden;
}
#canvas {
  display: block;
  width: 100%;
  height: 100%;
}
/* عناصر وهمية للسحب */
.drag-preview {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  opacity: 0.7;
  transform: scale(0.9);
}

/* قائمة السياق */
.context-menu {
  position: fixed;
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 8px;
  padding: 5px 0;
  min-width: 160px;
  z-index: 999;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  display: none;
}
.context-menu button {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #eee;
  padding: 8px 16px;
  text-align: right;
  cursor: pointer;
  font-size: 13px;
}
.context-menu button:hover { background: #0f3460; }
.context-menu button.danger { color: #e94560; }

/* لوحة المعلومات */
.info-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #16213ee0;
  border: 1px solid #0f3460;
  border-radius: 10px;
  padding: 15px;
  min-width: 200px;
  backdrop-filter: blur(5px);
  display: none;
}
.info-panel h3 { color: #e94560; margin-bottom: 8px; font-size: 14px; }
.info-panel p { font-size: 12px; margin: 3px 0; color: #ccc; }

/* مربع حوار */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: #00000080;
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 12px;
  padding: 25px;
  min-width: 320px;
  max-width: 90vw;
}
.modal h2 { color: #e94560; margin-bottom: 15px; }
.modal label { display: block; margin: 10px 0 5px; font-size: 13px; color: #aaa; }
.modal input, .modal select {
  width: 100%;
  padding: 8px 12px;
  background: #0f3460;
  border: 1px solid #1a1a4e;
  border-radius: 6px;
  color: #eee;
  font-size: 13px;
}
.modal input:focus { outline: none; border-color: #e94560; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
.modal-btns button {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}
.modal-btns .btn-primary { background: #e94560; color: #fff; }
.modal-btns .btn-secondary { background: #0f3460; color: #eee; }

/* حالة الاتصال */
.connection-mode { position: fixed; top: 70px; right: 20px; background: #e94560; padding: 6px 14px; border-radius: 6px; font-size: 13px; display: none; z-index: 100; }
.connection-mode.show { display: block; }
.conn-type-picker {
  position: fixed; top: 105px; right: 20px; background: #16213e;
  border: 1px solid #0f3460; border-radius: 8px; padding: 8px 12px;
  display: none; align-items: center; gap: 8px; z-index: 100; font-size: 12px;
}
.conn-type-picker.show { display: flex; }
.conn-type-picker .conn-type-btn { padding: 4px 10px; font-size: 12px; }
.conn-type-picker .conn-type-btn.active { background: #4fc3f7; color: #000; }

/* تحجيم */
.zoom-controls {
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 5px;
  z-index: 100;
}
.zoom-controls button {
  width: 36px; height: 36px;
  background: #0f3460;
  border: none;
  border-radius: 6px;
  color: #eee;
  cursor: pointer;
  font-size: 16px;
}
.zoom-controls button:hover { background: #e94560; }
.zoom-controls span { display: flex; align-items: center; padding: 0 10px; font-size: 13px; }

@media (max-width: 700px) {
  .toolbar .logo { font-size: 16px; }
  .tool-btn { padding: 6px 10px; font-size: 12px; }
  .modal { min-width: unset; width: 90vw; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo">🌐 محاكي الشبكات</div>
  <button class="tool-btn" data-tool="select" title="تحديد"><span class="icon">👆</span> تحديد</button>
  <button class="tool-btn" data-tool="connect" title="توصيل"><span class="icon">🔗</span> توصيل</button>
  <button class="tool-btn" data-tool="delete" title="حذف"><span class="icon">🗑️</span> حذف</button>
  <div class="separator"></div>
  <button class="tool-btn" data-device="pc" draggable="true"><span class="icon">💻</span> حاسوب</button>
  <button class="tool-btn" data-device="phone" draggable="true"><span class="icon">📱</span> هاتف</button>
  <button class="tool-btn" data-device="printer" draggable="true"><span class="icon">🖨️</span> طابعة</button>
  <button class="tool-btn" data-device="server" draggable="true"><span class="icon">🖥️</span> خادم</button>
  <button class="tool-btn" data-device="router" draggable="true"><span class="icon">📡</span> Router</button>
  <button class="tool-btn" data-device="switch" draggable="true"><span class="icon">🔀</span> Switch</button>
  <button class="tool-btn" data-device="hub" draggable="true"><span class="icon">🔲</span> Hub</button>
  <button class="tool-btn" data-device="cloud" draggable="true"><span class="icon">☁️</span> سحابة</button>
  <div class="separator"></div>
  <button class="tool-btn" id="clearAll" title="مسح"><span class="icon">🧹</span> مسح</button>
</div>

<div class="connection-mode" id="connectionMode">🔗 انقر الجهاز الأول ثم الثاني</div>
<div class="conn-type-picker" id="connTypePicker">
  <span>نوع التوصيل:</span>
  <button class="tool-btn conn-type-btn active" data-conn-type="wired">🔌 سلكي</button>
  <button class="tool-btn conn-type-btn" data-conn-type="wireless">📶 لاسلكي</button>
</div>
<div class="zoom-controls">
  <button id="zoomOut">−</button>
  <span id="zoomLevel">100%</span>
  <button id="zoomIn">+</button>
  <button id="zoomReset" title="إعادة">↺</button>
</div>

<div class="canvas-area" id="canvasArea">
  <canvas id="canvas"></canvas>
</div>

<div class="context-menu" id="contextMenu">
  <button data-action="edit">✏️ تعديل</button>
  <button data-action="info">ℹ️ معلومات</button>
  <button data-action="delete" class="danger">🗑️ حذف</button>
</div>

<div class="info-panel" id="infoPanel">
  <h3 id="infoTitle"></h3>
  <div id="infoContent"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">تعديل الجهاز</h2>
    <label>الاسم</label>
    <input type="text" id="editName" maxlength="30">
    <label>عنوان IP</label>
    <input type="text" id="editIP" placeholder="192.168.1.1">
    <div id="extraFields"></div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn-primary" onclick="saveDevice()">حفظ</button>
    </div>
  </div>
</div>

<script>
// ======================== قاموس الترجمة ========================
const DEVICE_NAMES = {
  pc: 'حاسوب', phone: 'هاتف', printer: 'طابعة',
  server: 'خادم', router: 'موجه', switch: 'محول', hub: 'مكرر',
  cloud: 'سحابة'
};
const DEVICE_ICONS = {
  pc: '💻', phone: '📱', printer: '🖨️',
  server: '🖥️', router: '📡', switch: '🔀', hub: '🔲',
  cloud: '☁️'
};
const DEVICE_COLORS = {
  pc: '#4fc3f7', phone: '#81c784', printer: '#ffb74d',
  server: '#ce93d8', router: '#e94560', switch: '#4dd0e1', hub: '#ffd54f',
  cloud: '#81d4fa'
};

// ======================== الحالة العامة ========================
const state = {
  devices: [],
  connections: [],
  selectedId: null,
  tool: 'select',
  dragDeviceType: null,
  pan: { x: 0, y: 0 },
  zoom: 1,
  isPanning: false,
  panStart: null,
  connectFirst: null,
  connectPendingSecond: null,
  deviceIdCounter: 0,
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ======================== توليد IP عشوائي ========================
function randomIP() {
  return `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
}

// ======================== إدارة الأجهزة ========================
function createDevice(type, x, y) {
  const id = ++state.deviceIdCounter;
  const d = {
    id, type, x, y,
    name: DEVICE_NAMES[type] + ' ' + id,
    ip: randomIP(),
    ports: [],
  };
  if (type === 'router') d.ports = [0,1,2,3];
  if (type === 'switch') d.ports = [0,1,2,3,4,5,6,7];
  if (type === 'hub') d.ports = [0,1,2,3,4];
  state.devices.push(d);
  return d;
}

// ======================== الرسم ========================
function getDeviceSize(type) {
  switch(type) {
    case 'router': return 60;
    case 'switch': return 70;
    case 'hub': return 55;
    case 'server': return 50;
    case 'cloud': return 90;
    default: return 45;
  }
}

function drawDevice(d) {
  const s = getDeviceSize(d.type) * state.zoom;
  const x = d.x * state.zoom + state.pan.x;
  const y = d.y * state.zoom + state.pan.y;
  const isSelected = d.id === state.selectedId;
  const color = DEVICE_COLORS[d.type];

  // ظل
  ctx.shadowColor = isSelected ? '#e9456080' : '#00000040';
  ctx.shadowBlur = isSelected ? 15 : 5;

  // خلفية
  ctx.beginPath();
  if (d.type === 'router' || d.type === 'switch' || d.type === 'cloud') {
    const r = d.type === 'cloud' ? 20 : 8;
    ctx.roundRect(x - s/2, y - s/2, s, s, r);
  } else {
    ctx.arc(x, y, s/2, 0, Math.PI * 2);
  }
  ctx.fillStyle = '#16213e';
  ctx.fill();
  ctx.strokeStyle = isSelected ? '#e94560' : color;
  ctx.lineWidth = isSelected ? 3 : 2;
  ctx.stroke();
  // خط منقط للسحابة
  if (d.type === 'cloud') {
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = isSelected ? '#e94560' : '#81d4fa';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.shadowBlur = 0;

  // أيقونة
  ctx.font = `${Math.round(s * 0.5)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(DEVICE_ICONS[d.type], x, y - s * 0.05);

  // الاسم
  ctx.font = `${Math.max(10, Math.round(11 * state.zoom))}px sans-serif`;
  ctx.fillStyle = '#ccc';
  ctx.textBaseline = 'top';
  ctx.fillText(d.name, x, y + s/2 + 4);

  // IP
  ctx.font = `${Math.max(8, Math.round(9 * state.zoom))}px sans-serif`;
  ctx.fillStyle = '#888';
  ctx.textBaseline = 'top';
  ctx.fillText(d.ip, x, y + s/2 + 18);
}

function drawConnection(c) {
  const a = state.devices.find(d => d.id === c.from);
  const b = state.devices.find(d => d.id === c.to);
  if (!a || !b) return;

  const ax = a.x * state.zoom + state.pan.x;
  const ay = a.y * state.zoom + state.pan.y;
  const bx = b.x * state.zoom + state.pan.x;
  const by = b.y * state.zoom + state.pan.y;
  const as = getDeviceSize(a.type) * state.zoom / 2;
  const bs = getDeviceSize(b.type) * state.zoom / 2;

  const dx = bx - ax, dy = by - ay;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len === 0) return;
  const nx = dx/len, ny = dy/len;

  const x1 = ax + nx * as, y1 = ay + ny * as;
  const x2 = bx - nx * bs, y2 = by - ny * bs;
  const isWireless = c.type === 'wireless';
  const isActive = c.active;

  if (isWireless) {
    // رسم لاسلكي - خط متقطع + موجة
    const midX = (x1+x2)/2, midY = (y1+y2)/2;
    const perpX = -ny, perpY = nx;
    const amp = 8 * state.zoom;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    // خط متقطع
    const steps = Math.max(4, Math.floor(len / (20 * state.zoom)));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const px = x1 + dx * t;
      const py = y1 + dy * t;
      if (i % 2 === 0) ctx.lineTo(px, py);
      else ctx.moveTo(px, py);
    }
    ctx.strokeStyle = isActive ? '#81c784' : '#2e7d32';
    ctx.lineWidth = isActive ? 2 : 1.5;
    ctx.stroke();

    // أيقونة لاسلكي في المنتصف
    ctx.font = `${Math.round(16 * state.zoom)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('📶', midX + perpX * amp * 1.2, midY + perpY * amp * 1.2);
  } else {
    // رسم سلكي - خط صلب
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = isActive ? '#4fc3f7' : '#0f3460';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.setLineDash(isActive ? [] : [5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // نقطة في المنتصف
    if (isActive) {
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      ctx.beginPath();
      ctx.arc(mx, my, 3, 0, Math.PI*2);
      ctx.fillStyle = '#4fc3f7';
      ctx.fill();
    }
  }
}

function render() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // خلفية الشبكة
  ctx.strokeStyle = '#1a1a3e';
  ctx.lineWidth = 1;
  const gridSize = 40 * state.zoom;
  const ox = state.pan.x % gridSize, oy = state.pan.y % gridSize;
  for (let x = ox; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = oy; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  state.connections.forEach(drawConnection);
  state.devices.forEach(drawDevice);
}

// ======================== إضافة جهاز بالسحب والإفلات ========================
document.querySelectorAll('[data-device]').forEach(btn => {
  btn.addEventListener('dragstart', e => {
    state.dragDeviceType = btn.dataset.device;
    e.dataTransfer.effectAllowed = 'copy';
  });
  btn.addEventListener('dragend', () => { state.dragDeviceType = null; });
});

canvas.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });

canvas.addEventListener('drop', e => {
  e.preventDefault();
  if (!state.dragDeviceType) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left - state.pan.x) / state.zoom;
  const y = (e.clientY - rect.top - state.pan.y) / state.zoom;
  createDevice(state.dragDeviceType, x, y);
  state.dragDeviceType = null;
  render();
});

// ======================== التفاعل مع الكانفاس ========================
function deviceAt(x, y) {
  for (let i = state.devices.length - 1; i >= 0; i--) {
    const d = state.devices[i];
    const s = getDeviceSize(d.type) / 2;
    const dx = d.x - x, dy = d.y - y;
    if (d.type === 'router' || d.type === 'switch' || d.type === 'cloud') {
      if (Math.abs(dx) <= s && Math.abs(dy) <= s) return d;
    } else {
      if (dx*dx + dy*dy <= s*s) return d;
    }
  }
  return null;
}

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left - state.pan.x) / state.zoom;
  const y = (e.clientY - rect.top - state.pan.y) / state.zoom;
  const d = deviceAt(x, y);
  if (d) {
    state.selectedId = d.id;
    render();
    const menu = document.getElementById('contextMenu');
    menu.style.display = 'block';
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.dataset.deviceId = d.id;
  }
});

document.addEventListener('click', () => {
  document.getElementById('contextMenu').style.display = 'none';
  document.getElementById('infoPanel').style.display = 'none';
});

document.getElementById('contextMenu').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = parseInt(document.getElementById('contextMenu').dataset.deviceId);
  const d = state.devices.find(dd => dd.id === id);
  if (!d) return;

  switch(btn.dataset.action) {
    case 'edit': openEditModal(d); break;
    case 'info': showInfo(d); break;
    case 'delete': removeDevice(d.id); break;
  }
  document.getElementById('contextMenu').style.display = 'none';
});

function showInfo(d) {
  const panel = document.getElementById('infoPanel');
  document.getElementById('infoTitle').textContent = `${DEVICE_ICONS[d.type]} ${d.name}`;
  const conns = state.connections.filter(c => c.from === d.id || c.to === d.id);
  const connList = conns.map(c => {
    const other = state.devices.find(dev => dev.id === (c.from === d.id ? c.to : c.from));
    const typeLabel = c.type === 'wireless' ? '📶 لاسلكي' : '🔌 سلكي';
    return other ? `<li>${other.name} (${typeLabel})</li>` : '';
  }).join('');
  document.getElementById('infoContent').innerHTML = `
    <p>النوع: ${DEVICE_NAMES[d.type]}</p>
    <p>${d.type === 'cloud' ? 'IP: عام' : 'IP: ' + d.ip}</p>
    <p>المنافذ: ${d.ports.length || 'غير معروف'}</p>
    <p>رقم: #${d.id}</p>
    ${conns.length ? `<p>التوصيلات (${conns.length}):</p><ul style="font-size:11px;padding-right:16px">${connList}</ul>` : '<p>لا توجد توصيلات</p>'}
  `;
  panel.style.display = 'block';
  setTimeout(() => { panel.style.display = 'none'; }, 5000);
}

// ======================== مربع حوار التعديل ========================
let editingDevice = null;
function openEditModal(d) {
  editingDevice = d;
  document.getElementById('modalTitle').textContent = `✏️ تعديل ${DEVICE_NAMES[d.type]}`;
  document.getElementById('editName').value = d.name;
  document.getElementById('editIP').value = d.ip;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  editingDevice = null;
}
function saveDevice() {
  if (!editingDevice) return;
  editingDevice.name = document.getElementById('editName').value || editingDevice.name;
  editingDevice.ip = document.getElementById('editIP').value || editingDevice.ip;
  closeModal();
  render();
}

// ======================== أحداث الماوس ========================
let dragDevice = null, dragOffset = null;

canvas.addEventListener('mousedown', e => {
  if (e.button === 2) return; // قائمة سياق
  if (e.button === 1 || e.shiftKey) { // التمرير
    state.isPanning = true;
    state.panStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left - state.pan.x) / state.zoom;
  const y = (e.clientY - rect.top - state.pan.y) / state.zoom;
  const d = deviceAt(x, y);

  if (state.tool === 'delete') {
    if (d) removeDevice(d.id);
    return;
  }

  if (state.tool === 'connect') {
    if (d) {
      if (!state.connectFirst) {
        state.connectFirst = d.id;
        document.getElementById('connectionMode').classList.add('show');
        document.getElementById('connectionMode').textContent = `🔗 اختر الجهاز الثاني (${d.name})`;
      } else if (d.id !== state.connectFirst) {
        state.connectPendingSecond = d.id;
        document.getElementById('connTypePicker').classList.add('show');
      }
    }
    return;
  }

  // تحديد وسحب
  state.selectedId = d ? d.id : null;
  if (d) {
    dragDevice = d;
    dragOffset = { x: x - d.x, y: y - d.y };
  }
  render();
});

canvas.addEventListener('mousemove', e => {
  if (state.isPanning) {
    state.pan.x = e.clientX - state.panStart.x;
    state.pan.y = e.clientY - state.panStart.y;
    render();
    return;
  }
  if (dragDevice) {
    const rect = canvas.getBoundingClientRect();
    dragDevice.x = (e.clientX - rect.left - state.pan.x) / state.zoom - dragOffset.x;
    dragDevice.y = (e.clientY - rect.top - state.pan.y) / state.zoom - dragOffset.y;
    render();
  }
});

canvas.addEventListener('mouseup', () => {
  dragDevice = null;
  state.isPanning = false;
});

canvas.addEventListener('mouseleave', () => {
  dragDevice = null;
  state.isPanning = false;
});

// ======================== الإتصالات ========================
function addConnection(fromId, toId, type = 'wired') {
  if (state.connections.some(c => (c.from === fromId && c.to === toId) || (c.from === toId && c.to === fromId))) {
    document.getElementById('connectionMode').textContent = '⚠️ يوجد اتصال مسبق';
    setTimeout(() => { document.getElementById('connectionMode').classList.remove('show'); }, 1500);
    return;
  }
  const c = { from: fromId, to: toId, active: false, type };
  state.connections.push(c);
  setTimeout(() => { c.active = true; render(); }, 500);
  render();
}

// اختيار نوع التوصيل
document.querySelectorAll('.conn-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.connType;
    const secondId = state.connectPendingSecond;
    if (state.connectFirst && secondId) {
      addConnection(state.connectFirst, secondId, type);
      state.connectFirst = null;
      state.connectPendingSecond = null;
      document.getElementById('connectionMode').classList.remove('show');
      document.getElementById('connTypePicker').classList.remove('show');
    }
  });
});

// ======================== إزالة ========================
function removeDevice(id) {
  state.devices = state.devices.filter(d => d.id !== id);
  state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
  if (state.selectedId === id) state.selectedId = null;
  if (state.connectFirst === id) { state.connectFirst = null; state.connectPendingSecond = null; document.getElementById('connTypePicker').classList.remove('show'); }
  render();
}

// ======================== أدوات ========================
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tool = btn.dataset.tool;
    if (state.tool !== 'connect') {
      state.connectFirst = null;
      state.connectPendingSecond = null;
      document.getElementById('connectionMode').classList.remove('show');
      document.getElementById('connTypePicker').classList.remove('show');
    }
  });
});
document.querySelector('[data-tool="select"]').classList.add('active');

// ======================== تكبير / تصغير ========================
document.getElementById('zoomIn').addEventListener('click', () => {
  state.zoom = Math.min(3, state.zoom + 0.1);
  updateZoom();
});
document.getElementById('zoomOut').addEventListener('click', () => {
  state.zoom = Math.max(0.2, state.zoom - 0.1);
  updateZoom();
});
document.getElementById('zoomReset').addEventListener('click', () => {
  state.zoom = 1;
  state.pan = { x: 0, y: 0 };
  updateZoom();
});
function updateZoom() {
  document.getElementById('zoomLevel').textContent = Math.round(state.zoom * 100) + '%';
  render();
}

// عجلة الفأرة
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  state.zoom = Math.max(0.2, Math.min(3, state.zoom + delta));
  updateZoom();
}, { passive: false });

// ======================== مسح الكل ========================
document.getElementById('clearAll').addEventListener('click', () => {
  if (state.devices.length === 0) return;
  if (confirm('هل أنت متأكد من مسح جميع العناصر؟')) {
    state.devices = [];
    state.connections = [];
    state.selectedId = null;
    state.connectFirst = null;
    state.connectPendingSecond = null;
    document.getElementById('connTypePicker').classList.remove('show');
    render();
  }
});

// ======================== تصدير / استيراد (اختصارات لوحة المفاتيح) ========================
document.addEventListener('keydown', e => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selectedId) {
      removeDevice(state.selectedId);
      e.preventDefault();
    }
  }
  if (e.key === 'Escape') {
    state.connectFirst = null;
    state.connectPendingSecond = null;
    document.getElementById('connectionMode').classList.remove('show');
    document.getElementById('connTypePicker').classList.remove('show');
    closeModal();
  }
  if (e.key === 'z' && e.ctrlKey) {
    const types = ['pc','phone','printer','server','router','switch','hub','cloud'];
    const t = types[Math.floor(Math.random()*types.length)];
    createDevice(t, Math.random()*600+50, Math.random()*400+50);
    render();
  }
});

// ======================== أمثلة تلقائية ========================
function loadExample() {
  const p1 = createDevice('pc', 120, 200);
  const p2 = createDevice('pc', 250, 350);
  const phone = createDevice('phone', 100, 400);
  const printer = createDevice('printer', 350, 200);
  const server = createDevice('server', 700, 150);
  const router = createDevice('router', 500, 300);
  const sw = createDevice('switch', 400, 450);
  const hub = createDevice('hub', 600, 400);
  const cloud = createDevice('cloud', 900, 300);

  addConnection(p1.id, sw.id, 'wired');
  addConnection(p2.id, sw.id, 'wired');
  addConnection(phone.id, hub.id, 'wireless');
  addConnection(hub.id, sw.id, 'wired');
  addConnection(sw.id, router.id, 'wired');
  addConnection(printer.id, sw.id, 'wired');
  addConnection(server.id, router.id, 'wired');
  addConnection(router.id, cloud.id, 'wired');
  addConnection(p2.id, router.id, 'wireless');
  render();
}

// تشغيل
loadExample();
</script>
